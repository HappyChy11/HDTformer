experiment:
  method: HDTformer
  dataset: BNB
  seed: 12
  result_dir: ../../result/HDTformer
  checkpoint_path: ../checkpoints/HDTformer_BNB_seed12.pt

data:
  path: ../../Data/RV_BNB.csv
  external_datasets:
    BNB_2024_05: ../../Data/RV_BNB_2024_05.csv
    BNB_2025_05: ../../Data/RV_BNB_2025_05.csv
    BNB_2026_05: ../../Data/RV_BNB_2026_05.csv
  target_column: realized_volatility_5T
  timestamp_column: timestamp
  train_ratio: 0.8
  val_ratio: 0.1
  anchor_lookback: 240
  short_lookback: 20
  long_lookback: 240
  tasks: [1, 5, 10, 20]
  task_stride_equals_horizon: true

model:
  embed_dim: 32
  dense_dim: 16
  num_heads: 4
  dropout: 0.1
  num_blocks: 4
  positional_encoding: true
  use_mask: false
  max_len: 5000
  msdcd:
    trend_kernel_size: 20
    seasonal_kernel_size: 7
    avg_pool_kernel_size: 3
    num_basis_kernels: 4

training:
  epochs: 20
  batch_size: 128
  learning_rate: 0.001
  num_workers: 0
  pin_memory: true
  precision: fp32
  gradient_clip: null
  scheduler_factor: 0.2
  scheduler_patience: 4
  resource_sample_interval: 1.0
