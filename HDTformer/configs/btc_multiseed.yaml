experiment:
  method: HDTformer
  dataset: BTC
  seeds: [12, 22, 32, 42, 52]
  result_dir: ../../result/BTC/HDTformer
  checkpoint_dir: ../checkpoints/BTC_HDTformer_multiseed

data:
  path: ../../Data/RV_BTC.csv
  aligned_datasets:
    BTC_2024: ../../Data/BTC_2024_4_5.csv
    BTC_2025: ../../Data/BTC_2025_4_5.csv
    BTC_2026: ../../Data/BTC_2026_4_5.csv
  target_column: realized_volatility_5T
  timestamp_column: timestamp
  train_ratio: 0.8
  val_ratio: 0.1
  anchor_lookback: 240
  short_lookback: 20
  long_lookback: 240
  tasks: [1, 5, 10, 20]
  task_stride_equals_horizon: true
  aligned_raw_start_month_day: 04-09T11:59:00Z
  aligned_raw_end_month_day: 05-30T23:59:00Z

model: &model
  embed_dim: 32
  dense_dim: 16
  num_heads: 4
  dropout: 0.1
  num_blocks: 4
  positional_encoding: true
  use_mask: false
  max_len: 5000
  msdcd:
    trend_kernel_size: 20
    seasonal_kernel_size: 7
    avg_pool_kernel_size: 3
    num_basis_kernels: 4

training:
  epochs: 20
  batch_size: 128
  learning_rate: 0.001
  num_workers: 0
  pin_memory: true
  precision: fp32
  gradient_clip: null
  scheduler_factor: 0.2
  scheduler_patience: 4
  resource_sample_interval: 1.0
